name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No secrets in CI, read-only token. Never use pull_request_target (ARCHITECTURE §5).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            jobs/requirements.txt
      - run: pip install -e "engine[dev]" -r jobs/requirements.txt -r supabase/tests/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python supabase/scripts/generate_seed.py --check
      # Database tests are skipped here (no database); the `database` job runs them.
      # The engine must stay covered at 90 % or more (prompts/02_engine_scoring.md).
      - run: pytest -q --cov=engine --cov-report=term --cov-fail-under=90

  database:
    name: Database (Supabase Postgres + RLS/RPC tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The real Supabase Postgres image: API roles, auth schema, Realtime publication.
      - run: supabase db start
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            jobs/requirements.txt
            supabase/tests/requirements.txt
      # The job tests (supabase/tests/test_jobs.py) import jobs/.
      - run: pip install -e "engine[dev]" -r jobs/requirements.txt -r supabase/tests/requirements.txt
      - run: pytest -q supabase/tests
        env:
          WARSTREET_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          WARSTREET_TEST_DB_PREPARED: "1"
          WARSTREET_REQUIRE_DB: "1"

  web:
    name: Web (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: End-to-end (local Supabase + Playwright + Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Auth, REST, Realtime and the Mailpit mailbox; no secret involved (local demo keys).
      - run: supabase start -x imgproxy,storage-api,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Point the build at the local Supabase
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          . "$RUNNER_TEMP/supabase.env"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
      # The briefing/front tests drive the dev mode (python -m jobs.dev) for bots and time.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            jobs/requirements.txt
      - run: pip install -e engine -r jobs/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          WARSTREET_PYTHON: python
      - run: npm run a11y
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
