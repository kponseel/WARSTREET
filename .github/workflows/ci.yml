name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No secrets in CI, read-only token. Never use pull_request_target (ARCHITECTURE §5).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            jobs/requirements.txt
      - run: pip install -e "engine[dev]" -r jobs/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
