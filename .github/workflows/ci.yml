name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No secrets in CI, read-only token. Never use pull_request_target (ARCHITECTURE §5).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            jobs/requirements.txt
      - run: pip install -e "engine[dev]" -r jobs/requirements.txt -r supabase/tests/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python supabase/scripts/generate_seed.py --check
      # Database tests are skipped here (no database); the `database` job runs them.
      # The engine must stay covered at 90 % or more (prompts/02_engine_scoring.md).
      - run: pytest -q --cov=engine --cov-report=term --cov-fail-under=90

  database:
    name: Database (Supabase Postgres + RLS/RPC tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The real Supabase Postgres image: API roles, auth schema, Realtime publication.
      - run: supabase db start
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            jobs/requirements.txt
            supabase/tests/requirements.txt
      # The job tests (supabase/tests/test_jobs.py) import jobs/.
      - run: pip install -e "engine[dev]" -r jobs/requirements.txt -r supabase/tests/requirements.txt
      - run: pytest -q supabase/tests
        env:
          WARSTREET_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          WARSTREET_TEST_DB_PREPARED: "1"
          WARSTREET_REQUIRE_DB: "1"

  web:
    name: Web (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
