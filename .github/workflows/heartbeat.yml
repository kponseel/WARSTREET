name: Heartbeat

# GitHub disables scheduled workflows after 60 days without repository activity.
# A weekly commit keeps the tick cron alive.
on:
  schedule:
    - cron: "17 3 * * 1" # Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Commit status/heartbeat.json
        run: |
          printf '{ "updated_at": "%s" }\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > status/heartbeat.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/heartbeat.json
          git commit -m "chore: weekly heartbeat" || exit 0
          git push
