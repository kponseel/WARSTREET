[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "warstreet-engine"
version = "0.0.0"
description = "Pure game logic for the weekly fantasy stock-market war game (no I/O)."
requires-python = ">=3.12"
dependencies = ["exchange_calendars>=4.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine", "engine.*"]
